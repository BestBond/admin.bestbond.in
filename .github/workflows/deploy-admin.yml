name: Deploy Admin (admin.bestbond.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-reward-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-rsync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deploy secrets
        shell: bash
        run: |
          missing=()
          [[ -z "${{ secrets.VPS_HOST }}" ]] && missing+=(VPS_HOST)
          [[ -z "${{ secrets.VPS_SSH_KEY }}" ]] && missing+=(VPS_SSH_KEY)
          [[ -z "${{ secrets.VITE_API_URL }}" ]] && missing+=(VITE_API_URL)
          if ((${#missing[@]})); then
            echo "::error::Missing required repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install and build
        run: npm ci

      - name: Bake API URL into bundle
        run: printf '%s\n' "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env.production

      - run: npm run build

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host key
        run: mkdir -p ~/.ssh && ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync static files to VPS
        env:
          REMOTE_BASE: ${{ vars.VPS_ADMIN_RSYNC_PATH }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${REMOTE_BASE:-/var/www/admin.bestbond.in/dist/}"
          rsync -avz --delete -e ssh dist/ "root@${{ secrets.VPS_HOST }}:${REMOTE_DIR}"
